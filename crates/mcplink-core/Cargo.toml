[package]
name = "mcplink-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mcplink"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }
directories = "6"
fs2 = "0.4"
glob = "0.3"
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde"] }
jsonschema = { version = "=0.60.2", default-features = false }
keyring = "4.2"
opener = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.9", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
yaml-edit = { version = "0.3.6", default-features = false }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_Packaging_Appx"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
