name: Signed macOS release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the source version
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: signed-macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify release ref and clean source
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from release_manifest import release_version
          assert os.environ['RELEASE_TAG'] == 'v' + release_version(), 'Tag/version mismatch'
          PY
          python3 scripts/release_manifest.py --require-clean --record artifacts/e2e/release-source
      - run: npm ci
      - name: Prepare previous installer for upgrade acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_upgrade_baseline.py --repo "$GITHUB_REPOSITORY" --artifact acceptance-macos-15 --platform macos --record artifacts/e2e/release-upgrade-baseline
      - name: Build, notarize and verify
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/mcplink-notarization.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          python3 - <<'PY'
          import os
          key = os.environ.get('APPLE_API_PRIVATE_KEY', '')
          assert key, 'Missing APPLE_API_PRIVATE_KEY secret'
          fd = os.open(os.environ['APPLE_API_KEY_PATH'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as f:
              f.write(key)
          PY
          npm run release:macos -- --signed
      - name: Create draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          directories = sorted(Path('artifacts/releases').glob('*/*'))
          assert len(directories) == 1
          subprocess.run([sys.executable, 'scripts/upload_release_draft.py', '--tag', os.environ['RELEASE_TAG'], '--directory', str(directories[0]), '--platform', 'macos', '--output', 'artifacts/build/public-release'], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-macos-release
          if-no-files-found: error
          path: artifacts/build/public-release/*
