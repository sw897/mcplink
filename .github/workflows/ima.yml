name: ima read-only MCP

on:
  push:
    paths: ["integrations/ima/**", ".github/workflows/ima.yml"]
  pull_request:
    paths: ["integrations/ima/**", ".github/workflows/ima.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integrations/ima
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/ima/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
