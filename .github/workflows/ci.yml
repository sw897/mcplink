name: Build and isolated acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Windows signing refusal boundaries
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-u', 'tests/e2e/windows_signing.py', '--binary', sys.executable, '--record', 'artifacts/e2e/ci-windows-signing'], check=True)
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/bundle.mjs', 'scripts/prepare-sidecar.mjs') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - run: npm run check
      - name: Cache Windows bundler downloads
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri/mcplink-downloads
          key: windows-bundler-v1-${{ hashFiles('package-lock.json', 'scripts/prepare_windows_bundler.py') }}
      - name: Prepare verified Windows bundler tools
        if: runner.os == 'Windows'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/prepare_windows_bundler.py
      - run: npm run bundle
      - name: Find a previous successful installer for upgrade acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python {0}
        run: |
          import os, subprocess, sys
          platform = "windows" if os.name == "nt" else "macos"
          artifact = "acceptance-windows-2025" if os.name == "nt" else "acceptance-macos-15"
          subprocess.run([sys.executable, "scripts/prepare_upgrade_baseline.py", "--repo", os.environ["GITHUB_REPOSITORY"], "--artifact", artifact, "--platform", platform, "--record", "artifacts/e2e/ci-upgrade-baseline"], check=True)
      - name: Select acceptance binary
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          binary = Path.cwd() / ("target/release/mcplink.exe" if os.name == "nt" else "target/release/bundle/macos/mcplink.app/Contents/MacOS/mcplink")
          assert binary.is_file(), binary
          version = __import__('json').loads(Path('package.json').read_text())['version']
          installers = list(Path('target/release/bundle').rglob('*setup.exe' if os.name == 'nt' else '*.dmg'))
          assert len(installers) == 1 and f'_{version}_' in installers[0].name, 'Stale or ambiguous installer output'
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"MCPLINK_E2E_BINARY={binary}\n")
      - name: Installed Windows native desktop acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: python {0}
        run: |
          import json, subprocess, sys
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          installer = next(Path('target/release/bundle/nsis').glob(f'*_{version}_*setup.exe'))
          subprocess.run([sys.executable, '-u', 'tests/e2e/windows_desktop.py', '--installer', str(installer), '--record', 'artifacts/e2e/ci-windows-native-desktop'], check=True)
      - name: Configuration integrity and recovery
        timeout-minutes: 5
        run: python -u tests/e2e/config_integrity.py --record artifacts/e2e/ci-integrity
      - name: Existing Bridge adoption and keep-native deletion
        timeout-minutes: 5
        run: python -u tests/e2e/bridge_adoption.py --record artifacts/e2e/ci-bridge-adoption
      - name: Select supported browser-driver Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - name: Prepare pinned browser driver
        run: npm install --prefix artifacts/e2e/ui-driver --no-save --package-lock=false --ignore-scripts agent-browser@0.41.2
      - name: Desktop renderer acceptance on Chrome
        timeout-minutes: 10
        shell: python {0}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          windows = os.name == 'nt'
          chrome = Path(os.environ['PROGRAMFILES']) / 'Google/Chrome/Application/chrome.exe' if windows else Path('/Applications/Google Chrome.app/Contents/MacOS/Google Chrome')
          driver = Path('artifacts/e2e/ui-driver/node_modules/agent-browser/bin') / ('agent-browser-win32-x64.exe' if windows else 'agent-browser-darwin-arm64')
          assert chrome.is_file() and driver.is_file(), 'Required Chrome or native browser driver is missing'
          if not windows:
              driver.chmod(driver.stat().st_mode | 0o111)
          subprocess.run([str(driver.resolve()), '--version'], check=True)
          subprocess.run(['node', '--version'], check=True)
          subprocess.run([sys.executable, '-u', 'tests/e2e/desktop_ui.py', '--record', 'artifacts/e2e/ci-renderer', '--session', 'mcplink-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}', '--chrome', str(chrome), '--browser-driver', str(driver.resolve())], check=True)
      - name: Restore project Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Isolated core acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/run.py --record artifacts/e2e/ci-core
      - name: Isolated named CLI acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/agent_cli.py --record artifacts/e2e/ci-cli
      - name: Isolated Claude source acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/claude_sources.py --record artifacts/e2e/ci-claude
      - name: Prepare pinned native Claude CLI for scoped acceptance
        run: npm install --prefix artifacts/e2e/native-claude --no-save --package-lock=false --ignore-scripts @anthropic-ai/claude-code@2.1.319
      - name: Select native Claude CLI
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          target = "win32-x64" if os.name == "nt" else "darwin-arm64"
          name = "claude.exe" if os.name == "nt" else "claude"
          binary = Path.cwd() / "artifacts/e2e/native-claude/node_modules/@anthropic-ai" / f"claude-code-{target}" / name
          assert binary.is_file(), binary
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"MCPLINK_E2E_CLAUDE={binary}\n")
      - name: Isolated Claude writable scope acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/claude_writable.py --record artifacts/e2e/ci-claude-writable
      - name: Native Claude single-entry calls with a synthetic model provider
        timeout-minutes: 3
        shell: python {0}
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-u', 'tests/e2e/claude_native.py', '--record', 'artifacts/e2e/ci-native-claude', '--claude', os.environ['MCPLINK_E2E_CLAUDE']], check=True)
      - name: Prepare pinned native Codex runtime
        run: npm install --prefix artifacts/e2e/native-codex --no-save --package-lock=false --ignore-scripts @openai/codex@0.167.0
      - name: Prepare pinned Hermes MCP runtime
        timeout-minutes: 8
        shell: python {0}
        run: |
          import os, subprocess, sys, venv
          from pathlib import Path
          source = Path('artifacts/e2e/native-hermes/source').resolve()
          source.mkdir(parents=True)
          subprocess.run(['git', 'init', '--quiet', str(source)], check=True)
          commit = '3b421578588243f920886e6fe79a6faa87ea026e'
          subprocess.run(['git', '-C', str(source), 'fetch', '--quiet', '--depth=1', 'https://github.com/NousResearch/hermes-agent.git', commit], check=True)
          subprocess.run(['git', '-c', 'core.longpaths=true', '-C', str(source), 'checkout', '--quiet', '--detach', 'FETCH_HEAD'], check=True)
          assert subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip() == commit
          runtime = Path('artifacts/e2e/native-hermes/runtime').resolve()
          venv.create(runtime, with_pip=True)
          python = runtime / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', '--disable-pip-version-check', '-r', 'tests/fixtures/hermes-mcp-requirements.txt'], check=True)
          codex = Path('artifacts/e2e/native-codex/node_modules/@openai')
          binaries = list(codex.rglob('bin/codex.exe' if os.name == 'nt' else 'bin/codex'))
          assert len(binaries) == 1, 'Missing or ambiguous native Codex binary'
          if os.name != 'nt':
              binaries[0].chmod(binaries[0].stat().st_mode | 0o111)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'MCPLINK_E2E_CODEX={binaries[0].resolve()}\nMCPLINK_E2E_HERMES_SOURCE={source}\nMCPLINK_E2E_HERMES_PYTHON={python}\n')
      - name: Native Codex and Hermes single-entry calls, refresh and recovery
        timeout-minutes: 6
        shell: python {0}
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-u', 'tests/e2e/native_clients.py', '--record', 'artifacts/e2e/ci-native-clients', '--codex', os.environ['MCPLINK_E2E_CODEX'], '--hermes-source', os.environ['MCPLINK_E2E_HERMES_SOURCE'], '--hermes-python', os.environ['MCPLINK_E2E_HERMES_PYTHON']], check=True)
      - name: Isolated current OpenCode format acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/opencode_sources.py --record artifacts/e2e/ci-opencode
      - name: Isolated native Agent configuration and shared proxy acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/agent_discovery.py --record artifacts/e2e/ci-agents
      - name: Office clients and offline connector import acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/office_agents.py --record artifacts/e2e/ci-office-agents
      - name: Prepare pinned Pi built-in MCP runtime
        run: npm install --prefix artifacts/e2e/native-pi --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@1.5.1
      - name: Pi native configuration and official runtime acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/pi_agent.py --record artifacts/e2e/ci-pi --pi-package artifacts/e2e/native-pi/node_modules/@earendil-works/pi-coding-agent
      - name: Isolated tool invocation acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/tool_calls.py --record artifacts/e2e/ci-tools
      - name: Isolated generated CLI acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/generated_cli.py --record artifacts/e2e/ci-generated
      - name: HTTP API Adapter acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/http_api.py --record artifacts/e2e/ci-http-api
      - name: Catalog and authentication boundary acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/architecture_boundaries.py --record artifacts/e2e/ci-boundaries
      - name: Aggregate routing and shared authentication acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/aggregate_gateway.py --record artifacts/e2e/ci-aggregate --pi-package artifacts/e2e/native-pi/node_modules/@earendil-works/pi-coding-agent
      - name: Stable aggregate catalog pagination
        timeout-minutes: 5
        run: python -u tests/e2e/catalog_pagination.py --record artifacts/e2e/ci-catalog-pagination
      - name: Independent entry tool policy acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/entry_policy.py --record artifacts/e2e/ci-entry-policy
      - name: Catalog notifications and official Pi live refresh
        timeout-minutes: 5
        run: python -u tests/e2e/catalog_refresh.py --record artifacts/e2e/ci-catalog-refresh --pi-package artifacts/e2e/native-pi/node_modules/@earendil-works/pi-coding-agent
      - name: Desktop and CLI generation contract workflow
        timeout-minutes: 5
        run: python -u tests/e2e/cli_workflow.py --record artifacts/e2e/ci-cli-workflow
      - name: Isolated remote transport acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/remote_transports.py --record artifacts/e2e/ci-remote
      - name: Isolated registered OAuth client acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/oauth_clients.py --record artifacts/e2e/ci-oauth
      - name: Windows background lifecycle acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -u tests/e2e/windows_background.py --record artifacts/e2e/ci-windows-background
      - name: Windows installer upgrade and recovery
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: python {0}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          version = __import__('json').loads(Path('package.json').read_text())['version']
          installer = next(Path('target/release/bundle/nsis').glob(f'*_{version}_*setup.exe'))
          previous = os.environ.get('MCPLINK_PREVIOUS_INSTALLER')
          subprocess.run([sys.executable, '-u', 'tests/e2e/windows_installer.py', '--installer', str(installer), '--record', 'artifacts/e2e/ci-windows-installed', *(['--previous-installer', previous] if previous else [])], check=True)
      - name: Daemon exit and process cleanup acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/daemon_lifecycle.py --record artifacts/e2e/ci-lifecycle
      - name: Windows preview release entry point
        if: runner.os == 'Windows'
        timeout-minutes: 12
        run: npm run release:windows
      - name: Curate public Windows distribution files
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import json, subprocess, sys
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          directories = list(Path('artifacts/releases').glob(f'{version}/*'))
          assert len(directories) == 1
          subprocess.run([sys.executable, 'scripts/upload_release_draft.py', '--tag', 'v' + version, '--directory', str(directories[0]), '--platform', 'windows', '--prepare-only', '--output', 'artifacts/build/windows-release'], check=True)
      - name: macOS DMG acceptance
        if: runner.os == 'macOS'
        run: |
          python3 tests/e2e/verify_package.py --record artifacts/e2e/ci-package
          python3 tests/e2e/installed_app.py --record artifacts/e2e/ci-installed
      - name: Record source baseline
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python scripts/release_manifest.py --require-clean --record artifacts/build/source --binary "target/release/mcplink${suffix}" --binary "target/release/mcplink-desktop${suffix}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            artifacts/build/source/release-manifest.json
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*setup.exe
            artifacts/build/windows-release/*


  public-source:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm audit --package-lock-only --audit-level=high
      - run: brew install gitleaks cargo-audit
      - run: gitleaks git --log-opts=HEAD --redact --no-banner
      - run: cargo audit
