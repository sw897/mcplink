name: Build and isolated acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/bundle.mjs', 'scripts/prepare-sidecar.mjs') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - run: npm run check
      - name: Cache Windows bundler downloads
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri/mcplink-downloads
          key: windows-bundler-v1-${{ hashFiles('package-lock.json', 'scripts/prepare_windows_bundler.py') }}
      - name: Prepare verified Windows bundler tools
        if: runner.os == 'Windows'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/prepare_windows_bundler.py
      - run: npm run bundle
      - name: Select acceptance binary
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          binary = Path.cwd() / ("target/release/mcplink.exe" if os.name == "nt" else "target/release/bundle/macos/mcplink.app/Contents/MacOS/mcplink")
          assert binary.is_file(), binary
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"MCPLINK_E2E_BINARY={binary}\n")
      - name: Configuration integrity and recovery
        timeout-minutes: 5
        run: python -u tests/e2e/config_integrity.py --record artifacts/e2e/ci-integrity
      - name: Existing Bridge adoption
        timeout-minutes: 5
        run: python -u tests/e2e/bridge_adoption.py --record artifacts/e2e/ci-bridge-adoption
      - name: Desktop renderer acceptance
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-driver" --no-save --package-lock=false agent-browser@0.41.2
          export PATH="$RUNNER_TEMP/ui-driver/node_modules/.bin:$PATH"
          python3 tests/e2e/desktop_ui.py --record artifacts/e2e/ci-renderer --session "mcplink-ci-${{ github.run_id }}-${{ github.run_attempt }}" --chrome "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: Isolated core acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/run.py --record artifacts/e2e/ci-core
      - name: Isolated named CLI acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/agent_cli.py --record artifacts/e2e/ci-cli
      - name: Isolated Claude source acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/claude_sources.py --record artifacts/e2e/ci-claude
      - name: Prepare pinned native Claude CLI for scoped acceptance
        run: npm install --prefix artifacts/e2e/native-claude --no-save --package-lock=false --ignore-scripts @anthropic-ai/claude-code@2.1.319
      - name: Select native Claude CLI
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          target = "win32-x64" if os.name == "nt" else "darwin-arm64"
          name = "claude.exe" if os.name == "nt" else "claude"
          binary = Path.cwd() / "artifacts/e2e/native-claude/node_modules/@anthropic-ai" / f"claude-code-{target}" / name
          assert binary.is_file(), binary
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"MCPLINK_E2E_CLAUDE={binary}\n")
      - name: Isolated Claude writable scope acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/claude_writable.py --record artifacts/e2e/ci-claude-writable
      - name: Isolated current OpenCode format acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/opencode_sources.py --record artifacts/e2e/ci-opencode
      - name: Isolated eight-Agent configuration and shared proxy acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/agent_discovery.py --record artifacts/e2e/ci-agents
      - name: Isolated tool invocation acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/tool_calls.py --record artifacts/e2e/ci-tools
      - name: Isolated generated CLI acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/generated_cli.py --record artifacts/e2e/ci-generated
      - name: Isolated remote transport acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/remote_transports.py --record artifacts/e2e/ci-remote
      - name: Isolated registered OAuth client acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/oauth_clients.py --record artifacts/e2e/ci-oauth
      - name: Windows background lifecycle acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -u tests/e2e/windows_background.py --record artifacts/e2e/ci-windows-background
      - name: Daemon exit and process cleanup acceptance
        timeout-minutes: 5
        run: python -u tests/e2e/daemon_lifecycle.py --record artifacts/e2e/ci-lifecycle
      - name: macOS DMG acceptance
        if: runner.os == 'macOS'
        run: |
          python3 tests/e2e/verify_package.py --record artifacts/e2e/ci-package
          python3 tests/e2e/installed_app.py --record artifacts/e2e/ci-installed
      - name: Record source baseline
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python scripts/release_manifest.py --require-clean --record artifacts/e2e/ci-manifest --binary "target/release/mcplink${suffix}" --binary "target/release/mcplink-desktop${suffix}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            artifacts/e2e/ci-integrity/report.json
            artifacts/e2e/ci-bridge-adoption/report.json
            artifacts/e2e/ci-renderer/report.json
            artifacts/e2e/ci-cli/report.json
            artifacts/e2e/ci-core/report.json
            artifacts/e2e/ci-claude/report.json
            artifacts/e2e/ci-claude-writable/report.json
            artifacts/e2e/ci-opencode/report.json
            artifacts/e2e/ci-agents/report.json
            artifacts/e2e/ci-tools/report.json
            artifacts/e2e/ci-generated/report.json
            artifacts/e2e/ci-remote/report.json
            artifacts/e2e/ci-oauth/report.json
            artifacts/e2e/ci-windows-background/report.json
            artifacts/e2e/ci-lifecycle/report.json
            artifacts/e2e/ci-package/package-report.json
            artifacts/e2e/ci-installed/report.json
            artifacts/e2e/ci-manifest/release-manifest.json
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*setup.exe


  public-source:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm audit --package-lock-only --audit-level=high
      - run: brew install gitleaks cargo-audit
      - run: gitleaks git --log-opts=HEAD --redact --no-banner
      - run: cargo audit
